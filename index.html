  <title>易创</title>
  <style>
    /* 启动占位：在任何脚本加载前先画出来，应用挂载后由 bootstrap 淡出移除。
       两笔渐细的墨痕对转：起笔重、收笔轻，浓淡是笔画分段、每段不透明地向底色靠（纯矢量，不用滤镜、遮罩和半透明叠加，桌面端 WebKit 不会糊也没有接缝）；
       底是作者当前主题色上的一层薄罩。 */
    #ew-boot {
      --boot-bg: #F2F0EA;
      --boot-veil: rgba(36, 31, 27, 0.055);
      --boot-ink: #241F1B;
      --boot-cinnabar: #7A3028;
      --boot-text: #655E56;
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: var(--boot-veil);
      -webkit-backdrop-filter: blur(14px) saturate(1.05);
              backdrop-filter: blur(14px) saturate(1.05);
      color: var(--boot-text);
      font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
      font-size: 13px;
      letter-spacing: 0.12em;
      transition: opacity 320ms ease;
      user-select: none;
      -webkit-user-select: none;
    }
    #ew-boot[data-theme="yellow"] { --boot-bg: #E9DFCC; --boot-veil: rgba(52, 39, 31, 0.06); --boot-ink: #34271F; --boot-cinnabar: #8B4A2F; --boot-text: #6B5849; }
    #ew-boot[data-theme="green"]  { --boot-bg: #E5E6DB; --boot-veil: rgba(38, 48, 40, 0.06); --boot-ink: #263028; --boot-cinnabar: #52634F; --boot-text: #59645A; }
    #ew-boot[data-theme="dark"]   { --boot-bg: #171714; --boot-veil: rgba(0, 0, 0, 0.28); --boot-ink: #ECE7DC; --boot-cinnabar: #9F472F; --boot-text: #8F887E; }
    #ew-boot.is-done { opacity: 0; pointer-events: none; }

    #ew-boot .boot-ink { position: relative; width: 128px; height: 128px; }
    #ew-boot .boot-stroke {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      transform-origin: 50% 50%;
      animation: ew-boot-spin 2.6s linear infinite;
      shape-rendering: geometricPrecision;
    }
    #ew-boot .boot-stroke-inner { animation: ew-boot-spin-back 1.8s linear infinite; }
    @keyframes ew-boot-spin { to { transform: rotate(360deg); } }
    @keyframes ew-boot-spin-back { to { transform: rotate(-360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #ew-boot .boot-stroke { animation: ew-boot-breathe 2s ease-in-out infinite; }
      @keyframes ew-boot-breathe { 50% { opacity: 0.45; } }
    }
  </style>
</head>

  <script>
    // 主题在设置库里，脚本加载前读不到；主题切换时留的记号只用来给启动页定底色
    try {
      var bootTheme = localStorage.getItem('ew-boot-theme')
      var boot = document.getElementById('ew-boot')
      if (bootTheme === 'dark' || bootTheme === 'yellow' || bootTheme === 'green') boot.setAttribute('data-theme', bootTheme)
      document.body.style.background = getComputedStyle(boot).getPropertyValue('--boot-bg').trim()
    } catch (e) { /* 无痕模式等拿不到记号时用默认主题 */ }
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
