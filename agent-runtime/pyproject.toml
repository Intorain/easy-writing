[project]
name = "easy-writing-agent-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["deepagents==0.7.17", "langgraph==1.2.12", "langchain-openai==1.6.4", "jsonschema>=4.25,<5",
  # cryptography 49 removed Intel macOS support; keep its last compatible wheel on Intel only.
  "cryptography==48.0.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "cryptography>=50.0.2; sys_platform != 'darwin' or platform_machine != 'x86_64'"]

[dependency-groups]
dev = ["pytest>=8,<9", "pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
